name: SwiftDeploy CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: Ubuntu-24.04
    
    steps:
      # 1. Checkout the codebase
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python environment for the CLI tool
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install Python dependencies and linters
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml jinja2

      # 4. Code Quality check (Linting)
      - name: Lint Code with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 5. Install application and test dependencies
      - name: Install Application and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-test.txt

      # 6. Run Python CLI Unit Tests
      - name: Run Unit Tests
        run: |
          python -m pytest tests/

      # 7. Install Open Policy Agent (OPA) CLI
      - name: Setup OPA CLI
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      # 8. Pre-compile & Validate Rego Policy Syntax
      - name: Validate OPA Policies Syntax
        run: |
          opa check policies/

      # 9. Run local OPA policy unit tests
      - name: Run OPA Policy Tests
        run: |
          opa test policies/

  integration-and-canary:
    needs: validate-and-test
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python for SwiftDeploy CLI
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SwiftDeploy CLI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2 psutil

      # 10. Setup Docker and run Docker Compose stack
      - name: Build and Deploy Docker Compose Stack
        run: |
          docker build -t swiftdeploy:latest .
          ./swiftdeploy init
          docker compose config --quiet
          docker compose up -d opa
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8182/health?plugins >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent http://localhost:8182/health?plugins >/dev/null; then
            docker compose logs opa
            exit 1
          fi
          SWIFTDEPLOY_REQUIRE_OPA=1 ./swiftdeploy deploy

      # 11. Integration Test: Check Health Status Endpoint
      - name: Verify Live Application Healthz
        run: |
          curl --fail http://localhost:5050/healthz || (docker compose logs && exit 1)

      # 12. Generate the deployment audit report
      - name: Generate Deployment Audit Report
        run: |
          ./swiftdeploy audit
          
      # 13. Confirm Artifact Generation
      - name: Verify Audit Reports and Artifacts
        run: |
          if [ ! -f history.jsonl ]; then echo "Error: history.jsonl missing!" && exit 1; fi
          if [ ! -f audit_report.md ]; then echo "Error: audit_report.md missing!" && exit 1; fi

      # 14. Archive the Deployment Audit Report
      - name: Upload Deployment Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swiftdeploy-audit-report
          path: |
            history.jsonl
            audit_report.md

      # 15. Tear down infrastructure safely
      - name: Stop Docker Compose Stack
        if: always()
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose down --volumes
          else
            echo "No generated Compose configuration; nothing to stop."
          fi
