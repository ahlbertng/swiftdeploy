name: SwiftDeploy CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: Ubuntu 26.04.1
    
    steps:
      # 1. Checkout the codebase
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python environment for the CLI tool
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install Python dependencies and linters
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pyyaml jinja2

      # 4. Code Quality check (Linting)
      - name: Lint Code with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 5. Run Python CLI Unit Tests
      - name: Run Unit Tests
        run: |
          pytest tests/

      # 6. Install Open Policy Agent (OPA) CLI
      - name: Setup OPA CLI
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      # 7. Pre-compile & Validate Rego Policy Syntax
      - name: Validate OPA Policies Syntax
        run: |
          opa check policies/

      # 8. Run local OPA policy unit tests
      - name: Run OPA Policy Tests
        run: |
          opa test policies/

  integration-and-canary:
    needs: validate-and-test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 9. Setup Docker and run Docker Compose stack
      - name: Start Docker Compose Stack
        run: |
          docker compose up -d --build
          echo "Waiting for application and Nginx gateway to initialize..."
          sleep 10

      # 10. Integration Test: Check Health Status Endpoint
      - name: Verify Live Application Healthz
        run: |
          curl --fail http://localhost/healthz || (docker compose logs && exit 1)

      # 11. Run Deployment Simulator Engine & Verify Metrics Gate
      - name: Run SwiftDeploy CLI Compilation and Metrics Evaluation
        run: |
          # Executes your engine to verify rendering, canary checks, and asset generation
          python -m swiftdeploy.cli --manifest manifest.yaml
          
      # 12. Confirm Artifact Generation
      - name: Verify Audit Reports and Artifacts
        run: |
          if [ ! -f history.jsonl ]; then echo "Error: history.jsonl missing!" && exit 1; fi
          if [ ! -f audit_report.md ]; then echo "Error: audit_report.md missing!" && exit 1; fi

      # 13. Archive the Deployment Audit Report
      - name: Upload Deployment Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swiftdeploy-audit-report
          path: |
            history.jsonl
            audit_report.md

      # 14. Tear down infrastructure safely
      - name: Stop Docker Compose Stack
        if: always()
        run: |
          docker compose down --volumes
